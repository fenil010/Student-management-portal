{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="glass col-md-6">
        <h3 class="text-center mb-4">Post Notice</h3>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Title</label>
                <input class="form-control" name="title" placeholder="Notice title" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Content</label>
                <textarea class="form-control" name="content" rows="5" placeholder="Write your notice here..." required></textarea>
            </div>
            <div class="mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="is_active" id="isActive" checked>
                    <label class="form-check-label" for="isActive">Active (Visible on home page)</label>
                </div>
            </div>
            <button class="btn btn-secondary w-100">Post Notice</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="{% url 'notice_list' %}" class="text-light text-decoration-none">← Back to Notices</a>
        </div>
    </div>
</div>
{% endblock %}
