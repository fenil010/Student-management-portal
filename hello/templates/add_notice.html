{% extends 'base.html' %}

{% block content %}
<!-- Breadcrumb -->
<nav class="flex mb-6" aria-label="Breadcrumb" data-aos="fade-up">
    <ol class="inline-flex items-center space-x-1 md:space-x-3">
        <li class="inline-flex items-center">
            <a href="{% url 'home' %}" class="inline-flex items-center text-sm font-medium text-gray-400 hover:text-white transition-colors">
                <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M10.707 2.293a1 1 0 00-1.414 0l-7 7a1 1 0 001.414 1.414L4 10.414V17a1 1 0 001 1h2a1 1 0 001-1v-2a1 1 0 011-1h2a1 1 0 011 1v2a1 1 0 001 1h2a1 1 0 001-1v-6.586l.293.293a1 1 0 001.414-1.414l-7-7z"></path>
                </svg>
                Home
            </a>
        </li>
        <li>
            <div class="flex items-center">
                <svg class="w-6 h-6 text-gray-600" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
                </svg>
                <a href="{% url 'notice_list' %}" class="ml-1 text-sm font-medium text-gray-400 hover:text-white transition-colors">Notices</a>
            </div>
        </li>
        <li>
            <div class="flex items-center">
                <svg class="w-6 h-6 text-gray-600" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd"></path>
                </svg>
                <span class="ml-1 text-sm font-medium text-white">Post Notice</span>
            </div>
        </li>
    </ol>
</nav>

<!-- Form Card -->
<div class="glass p-8 max-w-2xl mx-auto" data-aos="fade-up" data-aos-delay="100">
    <!-- Header -->
    <div class="text-center mb-8">
        <div class="w-16 h-16 bg-gradient-to-br from-red-500 to-pink-600 rounded-2xl mx-auto mb-4 flex items-center justify-center shadow-lg shadow-red-500/30">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z"></path>
            </svg>
        </div>
        <h1 class="text-2xl font-bold text-white mb-2">Post Notice</h1>
        <p class="text-gray-400">Create a new announcement for students</p>
    </div>
    
    <form method="POST" class="space-y-6">
        {% csrf_token %}
        
        <!-- Title -->
        <div class="relative">
            <label for="title" class="block mb-2 text-sm font-medium text-gray-300">Title *</label>
            <div class="relative">
                <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path>
                    </svg>
                </div>
                <input type="text" id="title" name="title" required placeholder="Notice title"
                    class="input-glass w-full pl-10 p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500/50 placeholder-gray-500">
            </div>
        </div>
        
        <!-- Content -->
        <div class="relative">
            <label for="content" class="block mb-2 text-sm font-medium text-gray-300">Content *</label>
            <textarea id="content" name="content" rows="6" required placeholder="Write your notice here..."
                class="input-glass w-full p-3 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-500/50 placeholder-gray-500"></textarea>
        </div>
        
        <!-- Status -->
        <div class="flex items-center p-4 bg-gray-800/50 rounded-xl">
            <input id="is_active" name="is_active" type="checkbox" checked
                class="w-4 h-4 border border-gray-600 rounded bg-gray-700 focus:ring-3 focus:ring-red-600">
            <label for="is_active" class="ml-2 text-sm font-medium text-gray-300">
                Active (Visible on home page)
            </label>
        </div>
        
        <!-- Submit Button -->
        <div class="flex flex-col sm:flex-row gap-4 pt-4">
            <button type="submit" 
                class="btn-animated flex-1 bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white font-medium rounded-xl p-3 transition-all shadow-lg shadow-red-500/25 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                </svg>
                Post Notice
            </button>
            <a href="{% url 'notice_list' %}" 
                class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-3 bg-gray-600 hover:bg-gray-700 text-white font-medium rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
