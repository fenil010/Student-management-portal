{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="glass p-8 w-full max-w-md text-center" data-gsap="fade-up">
        {% if success %}
        <!-- Success Icon -->
        <div
            class="w-24 h-24 bg-gradient-to-br from-green-400 to-emerald-500 rounded-full mx-auto mb-6 flex items-center justify-center shadow-lg shadow-green-500/30 animate-float">
            <i class="ph ph-check-circle text-5xl text-white"></i>
        </div>

        <h1 class="text-2xl font-bold text-green-400 mb-4">Success!</h1>
        {% else %}
        <!-- Error Icon -->
        <div
            class="w-24 h-24 bg-gradient-to-br from-red-400 to-rose-500 rounded-full mx-auto mb-6 flex items-center justify-center shadow-lg shadow-red-500/30">
            <i class="ph ph-x-circle text-5xl text-white"></i>
        </div>

        <h1 class="text-2xl font-bold text-red-400 mb-4">Verification Failed</h1>
        {% endif %}

        <p class="text-gray-300 mb-8">
            {{ message }}
        </p>

        <div class="space-y-4">
            {% if success %}
            <a href="{% url 'login' %}"
                class="btn-animated inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-600 hover:to-teal-600 text-white font-medium rounded-xl transition-all shadow-lg shadow-cyan-500/25">
                <i class="ph ph-sign-in"></i>
                Login Now
            </a>
            {% else %}
            <a href="{% url 'student_signup' %}"
                class="btn-animated inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-600 hover:to-teal-600 text-white font-medium rounded-xl transition-all shadow-lg shadow-cyan-500/25">
                <i class="ph ph-user-plus"></i>
                Sign Up Again
            </a>
            {% endif %}
        </div>

        <!-- Back Link -->
        <div class="mt-8 pt-6 border-t border-gray-700">
            <a href="{% url 'home' %}"
                class="inline-flex items-center text-sm text-gray-400 hover:text-cyan-400 transition-colors">
                <i class="ph ph-arrow-left mr-2"></i>
                Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
