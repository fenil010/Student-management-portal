{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
    <div class="glass p-8 w-full max-w-md text-center" data-gsap="fade-up">
        <!-- Success Icon -->
        <div
            class="w-24 h-24 bg-gradient-to-br from-green-400 to-teal-500 rounded-full mx-auto mb-6 flex items-center justify-center shadow-lg shadow-green-500/30 animate-float">
            <i class="ph ph-envelope-simple text-5xl text-white"></i>
        </div>

        <h1 class="text-2xl font-bold text-white mb-4">Check Your Email</h1>

        <p class="text-gray-300 mb-6">
            We've sent a verification link to:
        </p>

        <div class="bg-gray-800/50 rounded-xl p-4 mb-6 border border-cyan-500/30">
            <span class="text-cyan-400 font-medium">{{ email }}</span>
        </div>

        <p class="text-gray-400 text-sm mb-6">
            Please click the link in the email to verify your account.
            The link will expire in 24 hours.
        </p>

        <div class="space-y-4">
            <div class="flex items-center justify-center gap-2 text-gray-400 text-sm">
                <i class="ph ph-info text-cyan-400"></i>
                <span>Didn't receive the email? Check your spam folder.</span>
            </div>

            <a href="{% url 'login' %}"
                class="btn-animated inline-flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-600 hover:to-teal-600 text-white font-medium rounded-xl transition-all shadow-lg shadow-cyan-500/25">
                <i class="ph ph-sign-in"></i>
                Go to Login
            </a>
        </div>

        <!-- Back Link -->
        <div class="mt-8 pt-6 border-t border-gray-700">
            <a href="{% url 'home' %}"
                class="inline-flex items-center text-sm text-gray-400 hover:text-cyan-400 transition-colors">
                <i class="ph ph-arrow-left mr-2"></i>
                Back to Home
            </a>
        </div>
    </div>
</div>
{% endblock %}
