{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="glass col-md-5">
        <h3 class="text-center mb-4">Mark Attendance</h3>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Student</label>
                <select class="form-select" name="student_id" required>
                    <option value="">Select Student</option>
                    {% for student in students %}
                    <option value="{{ student.id }}">{{ student.name }} ({{ student.roll_number }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Date</label>
                <input class="form-control" type="date" name="date" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Subject</label>
                <input class="form-control" name="subject" placeholder="e.g., Data Structures" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="status" required>
                    <option value="Present">Present</option>
                    <option value="Absent">Absent</option>
                    <option value="Late">Late</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Remarks (Optional)</label>
                <textarea class="form-control" name="remarks" rows="2"></textarea>
            </div>
            <button class="btn btn-success w-100">Save Attendance</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="{% url 'attendance_list' %}" class="text-light text-decoration-none">← Back to Attendance</a>
        </div>
    </div>
</div>
{% endblock %}
