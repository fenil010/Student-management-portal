{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="glass col-md-5">
        <h3 class="text-center mb-4">Create Fee</h3>

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Student</label>
                <select class="form-select" name="student_id" required>
                    <option value="">Select Student</option>
                    {% for student in students %}
                    <option value="{{ student.id }}">{{ student.name }} ({{ student.roll_number }})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Fee Type</label>
                <select class="form-select" name="fee_type" required>
                    <option value="">Select Fee Type</option>
                    <option value="Tuition">Tuition Fee</option>
                    <option value="Hostel">Hostel Fee</option>
                    <option value="Library">Library Fee</option>
                    <option value="Lab">Laboratory Fee</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Amount (₹)</label>
                <input class="form-control" type="number" name="amount" min="0" step="0.01" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Due Date</label>
                <input class="form-control" type="date" name="due_date" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <select class="form-select" name="status" required>
                    <option value="Pending">Pending</option>
                    <option value="Paid">Paid</option>
                    <option value="Overdue">Overdue</option>
                </select>
            </div>
            <button class="btn btn-warning w-100">Create Fee</button>
        </form>
        
        <div class="text-center mt-3">
            <a href="{% url 'fee_list' %}" class="text-light text-decoration-none">← Back to Fees</a>
        </div>
    </div>
</div>
{% endblock %}
