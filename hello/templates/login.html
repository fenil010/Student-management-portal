{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="glass col-md-4">
        <h3 class="text-center mb-4">Admin Login</h3>

        {% if error %}
        <div class="alert alert-danger text-center py-2 mb-3">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input class="form-control mb-3" name="username" placeholder="Username" required autofocus>
            <input class="form-control mb-3" type="password" name="password" placeholder="Password" required>

            <button class="btn btn-primary w-100">Login</button>
        </form>

        <div class="text-center mt-3">
            <a href="{% url 'home' %}" class="text-light text-decoration-none">← Back to Home</a>
        </div>
    </div>
</div>
{% endblock %}
