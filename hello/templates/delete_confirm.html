{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="glass col-md-5 text-center">
        <h3 class="text-danger">⚠️ Confirm Delete</h3>
        <p class="my-4">Are you sure you want to delete this {{ type }}?</p>
        
        {% if object %}
        <div class="glass mb-4 text-start">
            <strong>{{ object }}</strong>
        </div>
        {% endif %}
        
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger me-2">Yes, Delete</button>
            <a href="javascript:history.back()" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
